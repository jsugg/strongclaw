minimum_pre_commit_version: "4.5.1"
# `pre-commit install` also wires the commit-msg and pre-push attribution guards; hooks
# without explicit stages stay on pre-commit so pushes do not rerun the type checkers.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: uv run isort --filter-files
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: black
        name: black
        entry: uv run black
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
      - id: attribution-commit-msg
        name: attribution guard (commit message)
        entry: uv run python tests/scripts/attribution_guard.py commit-msg
        language: system
        stages: [commit-msg]
        always_run: true
      - id: attribution-pre-push
        name: attribution guard (pushed ref and commits)
        entry: uv run python tests/scripts/attribution_guard.py pre-push
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.11
    hooks:
      - id: actionlint
