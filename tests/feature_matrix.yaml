    test: tests/suites/e2e/feature_verification/test_host_lifecycle.py::test_bootstrap_installs_the_locked_toolchain
  - id: setup.guided
    category: host-lifecycle
    title: clawops setup (non-interactive) renders the profile and activates the host services
    call_sites:
      - src/clawops/setup_cli.py:310
      - src/clawops/setup_cli.py:139
