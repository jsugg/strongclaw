# StrongClaw end-to-end feature matrix.
#
# One entry per product feature: where it lives (call sites), the single test that verifies it,
# and the lanes (provisioned CI hosts) it runs on; platforms are derived from the lanes.
# `verification` says how deep the check goes:
#   live        - real StrongClaw + real OpenClaw/acpx + real sidecars, no stand-ins
#   fake-model  - live, with the local deterministic model server as the model provider
#   stub        - a third-party endpoint (vendor CLI/adapter, messaging API) is stood in for
# `status: unverifiable` features cannot be exercised without third-party live services; they
# carry the reason and are reported UNVERIFIABLE, never PASS.
# Contract: tests/suites/contracts/repo/test_feature_matrix_contract.py.
schema_version: 1

lanes:
  linux-core:
    platform: linux
    profile: hypermemory
    scenario: linux-features
    activate_services: true
    description: Default product profile with systemd user services, sidecars, and the gateway.
  linux-lancedb:
    platform: linux
    profile: memory-lancedb-pro
    scenario: linux-features
    activate_services: true
    description: Vendored memory-lancedb-pro profile with systemd services and sidecars.
  linux-profiles:
    platform: linux
    profile: openclaw-default
    scenario: linux-features-local
    activate_services: false
    description: Profile matrix plus CLI-only operator tools on a harness-managed gateway.
  macos-launchd:
    platform: macos
    profile: openclaw-default
    scenario: macos-features
    activate_services: true
    description: macOS bootstrap and launchd-supervised runtime.

features:
