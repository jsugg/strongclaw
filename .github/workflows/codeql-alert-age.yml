name: CodeQL Alert Age

on:
  schedule:
    - cron: "37 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-alert-age
  cancel-in-progress: false

jobs:
  report:
    name: Report stale high/critical alerts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare report directory
        run: mkdir -p .artifacts/codeql-alert-age
      - name: Fetch open CodeQL alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" > .artifacts/codeql-alert-age/alerts.json
      - name: Generate report-only alert-age evidence
        run: python3 ./tests/scripts/codeql_alert_age.py --input-json .artifacts/codeql-alert-age/alerts.json --repository "${GITHUB_REPOSITORY}"
      - name: Upload alert-age report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-alert-age
          path: .artifacts/codeql-alert-age/
          if-no-files-found: error
          retention-days: 14
