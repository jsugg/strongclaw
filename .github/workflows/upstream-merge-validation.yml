name: Upstream Integration Validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-merged-upstream:
    name: Validate Upstream Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.9"
          enable-cache: true
      - name: Install shellcheck
        timeout-minutes: 5
        run: command -v shellcheck >/dev/null 2>&1 || curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/stable/shellcheck-stable.linux.x86_64.tar.xz" | sudo tar -xJv -C /usr/local/bin --strip-components=1 shellcheck-stable/shellcheck || sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get install --yes shellcheck
      - run: uv sync --locked
      - run: uv run python -m clawops supply-chain --repo-root . quality-gate
      - run: mkdir -p "$RUNNER_TEMP/strongclaw/upstream"
      - run: PYTHONPATH=src uv run python -m clawops harness --suite platform/configs/harness/security_regressions.yaml --output "$RUNNER_TEMP/strongclaw/upstream/security.jsonl"
      - run: PYTHONPATH=src uv run python -m clawops harness --suite platform/configs/harness/policy_regressions.yaml --output "$RUNNER_TEMP/strongclaw/upstream/policy.jsonl"
      - run: PYTHONPATH=src uv run python -m clawops context codebase index --config platform/configs/context/codebase.yaml --repo . --scale small --json
      - run: PYTHONPATH=src uv run python -m clawops workflow --workflow platform/configs/workflows/daily_healthcheck.yaml --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: upstream-merge-artifacts
          path: |
            coverage.xml
            pytest.xml
            ${{ runner.temp }}/strongclaw/upstream
