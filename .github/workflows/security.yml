name: Repository Security Analysis

on:
  workflow_call:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.rst"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.svg"
      - "**/*.webp"
      - "**/*.ico"
      - "**/*.pdf"
      - "LICENSE*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run-security-scans:
    name: Run Repository Quality and Runtime Security Scans
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.9"
          enable-cache: true
      - name: Install shellcheck
        timeout-minutes: 5
        run: command -v shellcheck >/dev/null 2>&1 || curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/stable/shellcheck-stable.linux.x86_64.tar.xz" | sudo tar -xJv -C /usr/local/bin --strip-components=1 shellcheck-stable/shellcheck || sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get install --yes shellcheck
      - run: uv sync --locked
      - name: Enforce independent review for security-critical PR changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --project . python3 ./tests/scripts/security_workflow.py enforce-independent-review --event-path "${GITHUB_EVENT_PATH}" --repository "${GITHUB_REPOSITORY}"
      - name: Verify channels rollout contract
        run: uv run --project . python3 ./tests/scripts/security_workflow.py verify-channels-contract --repo-root .
      - name: Run channels runtime smoke
        env:
          STRONGCLAW_CHANNELS_RUNTIME_TELEGRAM_BOT_TOKEN: "ci-smoke-telegram-token"
        run: uv run --project . python3 ./tests/scripts/security_workflow.py run-channels-runtime-smoke --repo-root . --artifact-path "${RUNNER_TEMP}/channels-runtime-smoke.json"
      - name: Run recovery backup/restore smoke
        run: uv run --project . python3 ./tests/scripts/security_workflow.py run-recovery-smoke --tmp-root "${RUNNER_TEMP}"
      - name: Run repository quality gate
        run: uv run python -m clawops supply-chain --repo-root . quality-gate
      - name: Coverage summary
        run: uv run --project . python3 ./tests/scripts/security_workflow.py write-coverage-summary --coverage-file coverage.xml --summary-file "${GITHUB_STEP_SUMMARY}"
      - name: Install Semgrep CLI
        run: python3 -m pip install --disable-pip-version-check "semgrep==1.156.0"
      - name: Run Semgrep
        run: semgrep scan --config security/semgrep/semgrep.yml --error .
      - name: Install gitleaks CLI
        env:
          GITLEAKS_VERSION: "8.28.0"
          GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
        run: uv run --project . python3 ./tests/scripts/security_workflow.py install-gitleaks --version "${GITLEAKS_VERSION}" --sha256 "${GITLEAKS_SHA256}" --runner-temp "${RUNNER_TEMP}" --github-path-file "${GITHUB_PATH}"
      - name: Run gitleaks
        run: gitleaks git --no-banner --no-color --exit-code 1 --log-level warn --redact
      - name: Install syft CLI
        env:
          SYFT_VERSION: "v1.42.2"
          SYFT_SHA256: "1d3cc98b13ce3dfb6083ef42f64f1033e40d7dea292e8ea85ed1cf88efb2f542"
        run: uv run --project . python3 ./tests/scripts/security_workflow.py install-syft --version "${SYFT_VERSION}" --sha256 "${SYFT_SHA256}" --runner-temp "${RUNNER_TEMP}" --github-path-file "${GITHUB_PATH}"
      - name: Generate SBOM
        run: syft dir:. -o spdx-json=sbom.spdx.json
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: true
          scan-type: fs
          scan-ref: .
          trivy-config: security/trivy/trivy.yaml
      - name: Preserve historical code-scanning categories
        if: always()
        run: uv run --project . python3 ./tests/scripts/security_workflow.py write-empty-sarif --output "${RUNNER_TEMP}/empty-security.sarif" --information-uri "https://github.com/jsugg/strongclaw"
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always()
        with:
          sarif_file: ${{ runner.temp }}/empty-security.sarif
          category: .github/workflows/security.yml:run-security-scans
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always()
        with:
          sarif_file: ${{ runner.temp }}/empty-security.sarif
          category: .github/workflows/security.yml:security
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-artifacts
          path: |
            coverage.xml
            pytest.xml
            sbom.spdx.json
            ${{ runner.temp }}/channels-runtime-smoke.json

  run-codeql-analysis:
    name: Run CodeQL Analysis
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          config-file: security/codeql/codeql-config.yml
          languages: python,javascript
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
