name: Release Build and Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release-quality-gate:
    name: Release Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.9"
          enable-cache: true
      - name: Install shellcheck
        timeout-minutes: 5
        run: command -v shellcheck >/dev/null 2>&1 || curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/stable/shellcheck-stable.linux.x86_64.tar.xz" | sudo tar -xJv -C /usr/local/bin --strip-components=1 shellcheck-stable/shellcheck || sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && sudo apt-get install --yes shellcheck
      - run: uv sync --locked
      - name: Run repository quality gate
        run: uv run python -m clawops supply-chain --repo-root . quality-gate

  release-fresh-host-acceptance:
    name: Release Fresh Host Acceptance
    uses: ./.github/workflows/fresh-host-core.yml

  release-memory-plugin-verification:
    name: Release Memory Plugin Verification
    uses: ./.github/workflows/memory-plugin-verification.yml

  release-runtime-readiness:
    name: Release Runtime Readiness
    needs:
      - release-quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.9"
          enable-cache: true
      - run: uv sync --locked
      - name: Run release runtime-readiness commands
        run: python3 ./tests/scripts/release_workflow.py runtime-readiness --repo-root .

  publish-release-artifacts:
    name: Build Verify and Publish Release
    permissions:
      checks: read
      contents: write
      attestations: write
      id-token: write
    needs:
      - release-quality-gate
      - release-fresh-host-acceptance
      - release-memory-plugin-verification
      - release-runtime-readiness
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.9"
          enable-cache: true
      - run: uv sync --locked
      - name: Verify release tag matches package version
        run: python3 ./tests/scripts/release_workflow.py verify-tag-version --tag "${GITHUB_REF_NAME}" --repo-root .
      - name: Verify release tag preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ./tests/scripts/release_workflow.py verify-tag-preflight --tag "${GITHUB_REF_NAME}" --repo-root . --repository "${GITHUB_REPOSITORY}"
      - name: Clean release artifact directories
        run: python3 ./tests/scripts/release_workflow.py clean-artifacts --path build --path dist
      - name: Build release artifacts
        run: uv run python -m build
      - name: Verify release artifacts
        run: python3 ./tests/scripts/release_workflow.py verify-artifacts --dist-dir dist
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: spdx-json
          output-file: sbom.spdx.json
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false
      - name: Generate release manifest and checksums
        run: python3 ./tests/scripts/release_workflow.py write-release-metadata --tag "${GITHUB_REF_NAME}" --repo-root . --dist-dir dist --sbom-path sbom.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts
          path: |
            dist/*
            sbom.spdx.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ./tests/scripts/release_workflow.py publish-github-release --tag "${GITHUB_REF_NAME}" --dist-dir dist --sbom-path sbom.spdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            sbom.spdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: sbom.spdx.json
