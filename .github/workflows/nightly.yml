name: Nightly Test Run

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run-nightly-validation:
    name: Run Nightly Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.9"
          enable-cache: true
      - name: Sync nightly environment
        run: uv sync --locked
      - name: Run nightly pytest suite
        run: uv run pytest -q --junitxml=pytest.xml --cov=src/clawops --cov-report=xml
      - name: Compile nightly Python sources
        run: PYTHONPATH=src uv run python -m compileall -q src tests
      - name: Create nightly artifact directory
        run: mkdir -p "$RUNNER_TEMP/strongclaw/nightly"
      - name: Render nightly OpenClaw profile matrix
        run: uv run python ./tests/scripts/compatibility_matrix.py assert-openclaw-profiles --repo-root . --runner-temp "${RUNNER_TEMP}"
      - name: Run nightly security harness
        run: PYTHONPATH=src uv run python -m clawops harness --suite platform/configs/harness/security_regressions.yaml --output "$RUNNER_TEMP/strongclaw/nightly/security.jsonl"
      - name: Run nightly policy harness
        run: PYTHONPATH=src uv run python -m clawops harness --suite platform/configs/harness/policy_regressions.yaml --output "$RUNNER_TEMP/strongclaw/nightly/policy.jsonl"
      - name: Rebuild nightly context index
        run: PYTHONPATH=src uv run python -m clawops context codebase index --config platform/configs/context/codebase.yaml --repo . --scale small --json
      - name: Dry-run nightly healthcheck workflow
        run: PYTHONPATH=src uv run python -m clawops workflow --workflow platform/configs/workflows/daily_healthcheck.yaml --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-artifacts
          path: |
            coverage.xml
            pytest.xml
            ${{ runner.temp }}/strongclaw/nightly

  warm-fresh-host-caches:
    name: Warm Fresh Host Caches
    uses: ./.github/workflows/fresh-host-cache-warm.yml

  run-nightly-fresh-host-acceptance:
    name: Nightly Fresh Host Acceptance
    needs: warm-fresh-host-caches
    uses: ./.github/workflows/fresh-host-core.yml
    with:
      docker_pull_parallelism: "2"
      docker_pull_max_attempts: "5"
      enable_package_cache: true
    secrets: inherit
