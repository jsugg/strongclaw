name: Memory Plugin Integration Checks

on:
  workflow_call:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "**/*.rst"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.svg"
      - "**/*.webp"
      - "**/*.ico"
      - "**/*.pdf"
      - "LICENSE*"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify-vendored-memory-plugin:
    name: Run Memory Plugin Integration Checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.16.0", "24.13.1"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            platform/node-tools/package-lock.json
            platform/plugins/memory-lancedb-pro/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.9"
          enable-cache: true
      - run: uv sync --locked
      - run: PYTHONPATH=src uv run python -m clawops config --asset-root . memory --set-profile memory-lancedb-pro --output "$RUNNER_TEMP/openclaw.json"
      - run: python3 ./tests/scripts/memory_plugin_verification.py run-clawops-memory-migration --repo-root . --runner-temp "$RUNNER_TEMP"
      - run: python3 ./tests/scripts/memory_plugin_verification.py run-vendored-host-checks --repo-root .
  verify-hypermemory-qdrant:
    name: Run Hypermemory Qdrant Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      qdrant:
        image: ghcr.io/qdrant/qdrant/qdrant:v1.20.0@sha256:3a80102f9b2855184d74b6d79e3351320314298c4be1f88ecaf832f147ef7a02
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.9"
          enable-cache: true
      - run: uv sync --locked
      - run: python3 ./tests/scripts/memory_plugin_verification.py wait-for-qdrant --url http://127.0.0.1:6333/healthz --attempts 30 --sleep-seconds 2.0
      - run: uv run pytest -q -m "hypermemory and qdrant"
        env:
          QDRANT_TEST_MODE: real
          TEST_QDRANT_URL: http://127.0.0.1:6333
  verify-strongclaw-hypermemory-host:
    name: Run strongclaw-hypermemory Host Checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.13.1"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.9"
          enable-cache: true
      - run: uv sync --locked
      - run: npm --prefix platform/plugins/strongclaw-hypermemory run test:openclaw-host
