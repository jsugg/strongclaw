services:
  browserlab-proxy:
    image: ubuntu/squid:latest@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    ports:
      - "127.0.0.1:3128:3128"
    volumes:
      - ../workers/browser-lab/squid.conf:/etc/squid/squid.conf:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  browserlab-playwright:
    image: mcr.microsoft.com/playwright:v1.65.0-jammy@sha256:5a8620d70618963ec6628dd77cc25ec6a4b232e26c4a41241a8c1def04e2dc04
    depends_on:
      - browserlab-proxy
    environment:
      HTTP_PROXY: http://browserlab-proxy:3128
      HTTPS_PROXY: http://browserlab-proxy:3128
      NO_PROXY: localhost,127.0.0.1,browserlab-proxy
    command: ["bash", "/workspace/browser-lab/start-cdp.sh"]
    shm_size: "1gb"
    ports:
      - "127.0.0.1:9222:9222"
    volumes:
      - ${STRONGCLAW_COMPOSE_STATE_DIR:?Set STRONGCLAW_COMPOSE_STATE_DIR or use clawops ops browser-lab up}/browser-lab:/workspace/state
      - ../workers/browser-lab:/workspace/browser-lab:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
